name: CI

# Runs on GitHub-hosted runners for every push to master and every pull request.
# Every step also runs locally: npm ci && npm run fetch:gws && npm run check.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
          - runner: macos-26-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install the gws package for ${{ matrix.target }}
        run: npm run fetch:gws

      # The pack test installs each tested stock OpenCode (2.2.3, 2.2.4 and
      # 2.2.5, TESTED_HOSTS in src/domain/host.ts) into its temp folder,
      # since OPENCODE_BIN_2_2_3, _2_2_4 and _2_2_5 are unset here.
      - name: Check
        run: npm run check
