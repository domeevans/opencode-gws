name: CI

# Runs on GitHub-hosted runners for every push to master and every pull request.
# Every step also runs locally: npm ci && npm run fetch:gws && npm run check.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workflows are tools too: a YAML file GitHub refuses fails the whole run, so this is its own job.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
  check:
    name: Check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
          - runner: macos-26-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install the gws package for ${{ matrix.target }}
        run: npm run fetch:gws

      # The stock OpenCode binaries the host and pack stages spawn, one per tested release (TESTED_HOSTS in
      # src/domain/host.ts), so every tested release really runs here: a missing one fails the run (PUBLIC-PATTERN R34).
      - name: Stock OpenCode binaries
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          for version in 2.2.3 2.2.4 2.2.5 2.2.6; do
            dir="$RUNNER_TEMP/stock-$version"
            mkdir -p "$dir"
            (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@$version" "@opencode/cli-$platform@$version" --omit=optional --ignore-scripts --no-audit --no-fund)
            echo "OPENCODE_BIN_${version//./_}=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done

      - name: Check
        run: npm run check
