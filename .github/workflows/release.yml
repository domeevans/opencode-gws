name: Release

# Publishes a v* tag to npm with trusted publishing (OIDC) and provenance,
# after a reviewer approves the release environment.
# Order: guard, npm ci, npm run check, pack the main package and the four
# gws packages, run the pack test on those exact tarballs, then publish the
# gws packages and finally the main package.
# The guard refuses a private package or a tag that differs from the
# version. A package whose exact version is already on npm is skipped, so
# a rerun is safe.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard
        run: |
          node -e '
            const pkg = require("./package.json")
            if (pkg.private !== undefined && pkg.private !== false) {
              console.error("::error::package.json has \"private\": true, so nothing was published. The gws packages take the same flag.")
              process.exit(1)
            }
            if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) {
              console.error("::error::Tag " + process.env.GITHUB_REF_NAME + " does not match package.json version " + pkg.version + ".")
              process.exit(1)
            }
          '

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Require npm 11.5.1 or later for trusted publishing
        run: node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("::error::npm " + process.argv[1] + " cannot use trusted publishing."); process.exit(1) }' "$(npm --version)"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install the gws package for this runner
        run: npm run fetch:gws

      - name: Check
        run: npm run check

      # Each gws package is built from the pinned upstream archive; the build
      # fails unless the archive and the binary match native/provenance.json.
      - name: Pack the main package and the four gws packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tarballs"
          node scripts/build-bin-packages.mjs --all --out "$RUNNER_TEMP/gws-bin"
          for dir in "$RUNNER_TEMP"/gws-bin/opencode-gws-bin-*; do
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tarballs" "$dir"
          done
          ls -l "$RUNNER_TEMP/tarballs"

      - name: Run the pack test on those tarballs
        run: |
          PACK_TARBALL="$(ls "$RUNNER_TEMP"/tarballs/joe-broadhead-opencode-gws-[0-9]*.tgz)" \
          PACK_BIN_TARBALL="$(ls "$RUNNER_TEMP"/tarballs/joe-broadhead-opencode-gws-bin-linux-x64-gnu-*.tgz)" \
          npm run test:pack

      - name: Publish the gws packages, then the main package
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          version="$(node -p 'require("./package.json").version')"
          # Publish one tested tarball, unless that exact version is already on npm.
          # A 404 means it is not published yet; any other failure stops the release.
          publish() {
            name="$1"
            tarball="$2"
            if published="$(npm view "$name@$version" version 2>"$RUNNER_TEMP/npm-view.log")"; then
              if [ "$published" = "$version" ]; then
                echo "::notice::$name@$version is already on npm; skipping it."
                return 0
              fi
            elif ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
              cat "$RUNNER_TEMP/npm-view.log"
              echo "::error::Could not check whether $name@$version is already on npm."
              exit 1
            fi
            npm publish "$tarball" --provenance --access public --tag "$tag"
          }
          for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            publish "@joe-broadhead/opencode-gws-bin-$target" "$RUNNER_TEMP/tarballs/joe-broadhead-opencode-gws-bin-$target-$version.tgz"
          done
          publish "@joe-broadhead/opencode-gws" "$RUNNER_TEMP/tarballs/joe-broadhead-opencode-gws-$version.tgz"
