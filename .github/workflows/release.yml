name: Release

# Publishes the main package to npm with trusted publishing (OIDC) and provenance, after a reviewer approves the
# release environment. Order: guard, npm ci, fetch the pinned gws executable (the pack test runs it), npm run check,
# pack the main package, run the pack test on that exact tarball, then publish it.
# The gws executable is not in the package: the plugin downloads it from its GitHub Release (NATIVE-DESIGN.md).
# The guard refuses a private package or a tag that differs from the version. A package whose exact version is
# already on npm is skipped, so a rerun is safe.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs outside the release environment, so a refused tag never waits for a reviewer.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard
        run: |
          node -e '
            const pkg = require("./package.json")
            if (pkg.private !== undefined && pkg.private !== false) {
              console.error("::error::package.json has \"private\": true, so nothing was published.")
              process.exit(1)
            }
            if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) {
              console.error("::error::Tag " + process.env.GITHUB_REF_NAME + " does not match package.json version " + pkg.version + ".")
              process.exit(1)
            }
          '

  release:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Require npm 11.5.1 or later for trusted publishing
        run: node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("::error::npm " + process.argv[1] + " cannot use trusted publishing."); process.exit(1) }' "$(npm --version)"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Fetch the pinned gws executable for this runner
        run: npm run fetch:gws

      - name: Check
        run: npm run check

      - name: Pack the main package
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tarballs"
          ls -l "$RUNNER_TEMP/tarballs"

      - name: Run the pack test on that tarball
        run: |
          PACK_TARBALL="$(ls "$RUNNER_TEMP"/tarballs/joe-broadhead-opencode-gws-[0-9]*.tgz)" npm run test:pack

      - name: Publish the main package
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          version="$(node -p 'require("./package.json").version')"
          # Publish the tested tarball, unless that exact version is already on npm.
          # A 404 means it is not published yet; any other failure stops the release.
          if published="$(npm view "@joe-broadhead/opencode-gws@$version" version 2>"$RUNNER_TEMP/npm-view.log")"; then
            if [ "$published" = "$version" ]; then
              echo "::notice::@joe-broadhead/opencode-gws@$version is already on npm; skipping it."
              exit 0
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
            cat "$RUNNER_TEMP/npm-view.log"
            echo "::error::Could not check whether @joe-broadhead/opencode-gws@$version is already on npm."
            exit 1
          fi
          npm publish "$RUNNER_TEMP/tarballs/joe-broadhead-opencode-gws-$version.tgz" --provenance --access public --tag "$tag"
